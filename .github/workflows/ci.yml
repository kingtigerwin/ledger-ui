name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check src infra
      - run: npm test
      - run: npm run build
      # Catches infra mistakes on pull requests, before they reach a deploy.
      - run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'

  # Deploys main after the tests pass. Needs, in the repo's settings:
  #   secret   AWS_DEPLOY_ROLE_ARN  (output of the LedgerUiCiAccess stack; a secret so the
  #                                  account ID in it never appears in this public repo's logs)
  #   variable DEPLOY_ENABLED       ("true" once the above is set; job-level `if` can't read secrets)
  deploy:
    # Skipped until the one-time setup in README.md is done.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the running one instead of racing it.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      id-token: write # lets the job get a GitHub OIDC token to assume the AWS role
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          # Also hides the account ID wherever later steps print it (e.g. ARNs in cdk output).
          mask-aws-account-id: true
      # Deploys LedgerUiCertificate first when it has changed, since LedgerUi depends on it.
      - name: Deploy
        run: npx cdk deploy LedgerUi --require-approval never --outputs-file cdk-outputs.json
      - name: Smoke test
        run: UI_URL="$(jq -r .LedgerUi.UiUrl cdk-outputs.json)" npm run smoke
